<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 北海道旅行｜費用試算</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182235;--muted:#64748b;--line:#dfe5ee;--blue:#1677e8;--blue2:#eef6ff;--green:#047857;--purple:#7c3aed;--orange:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;cursor:pointer;text-align:left}.tab.active{border:2px solid var(--blue);background:var(--blue2)}.date{font-size:18px;font-weight:900}.sub{margin-top:5px;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1.55fr .85fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 15px rgba(15,23,42,.05)}
h2{margin:0 0 5px;font-size:22px}.meta{color:var(--muted);font-size:13px;margin-bottom:20px}.section{margin-top:25px}.section:first-child{margin-top:0}.section-title{font-size:21px;font-weight:900;padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:5px}.sub-title{font-size:18px;font-weight:900;margin-top:18px;padding:10px 0 7px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;border-top:1px solid var(--line);padding:14px 4px}.left{display:flex;gap:10px}.left input[type=checkbox]{margin-top:5px;width:18px;height:18px}.name{font-size:17px;font-weight:800}.detail{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.55}.price{font-size:18px;font-weight:900;white-space:nowrap}.tag{display:inline-block;background:#f1f5f9;border-radius:999px;padding:3px 8px;font-size:12px;margin-top:5px;color:#475569}
.currency{font-size:12px;color:var(--muted);font-weight:600}.jpy{color:var(--purple)}.ntd{color:#0f766e}
.ski-block{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:15px;background:#fcfdff}.ski-head{font-size:18px;font-weight:900;margin-bottom:10px}
.day-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.day-control label{font-weight:700}.day-input{width:90px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;text-align:center}.day-unit{color:var(--muted);font-size:14px}.calc-line{margin-top:9px;color:var(--muted);font-size:13px}.calc-line b{color:var(--purple);font-size:15px}
.gear-option{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.gear-option:first-of-type{border-top:0}.gear-option input{width:18px;height:18px}.gear-days{font-weight:800;font-size:16px}.gear-price{margin-left:auto;text-align:right;font-weight:900;color:var(--purple)}
.summary{position:sticky;top:15px}.rate{background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:12px;margin:12px 0 16px}.rate b{font-size:17px}.big{font-size:31px;font-weight:950;margin:8px 0}.per{font-weight:900;color:var(--green)}.breakdown{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}.breakdown div{display:flex;justify-content:space-between;padding:6px 0}.small{font-size:13px;color:var(--muted);line-height:1.55}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px;font-size:12px;margin-top:15px}.reset{margin-top:13px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
@media(max-width:850px){.tabs{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.summary{position:static}}
@media(max-width:520px){.tabs{grid-template-columns:1fr}.row{grid-template-columns:1fr}.price{padding-left:28px}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>2027 北海道旅行｜費用試算</h1><p>點選日期方案查看完整費用；機票依航段分組，滑雪依「人數 × 天數」計算。</p></div>
<div id="tabs" class="tabs"></div>
<div class="grid"><main id="details" class="card"></main><aside id="summary" class="card summary"></aside></div>
</div>
<script>
const packages=[{"title": "① 2/16~2/21 6天｜3人(會去函館，有日本國內線)", "items": [{"section": "住宿", "date": "札幌", "name": "札幌王子飯店", "detail": "", "time": "", "price": 4292, "unit": "/間晚", "note": "*1間*4晚 (無早餐，早餐每人額外+722)"}, {"section": "住宿", "date": "函館", "name": "函館JR旅館", "detail": "", "time": "", "price": 9743, "unit": "/間晚", "note": "*1間*1晚 (無早餐，早餐每人額外+722)"}, {"section": "滑雪", "date": "來回巴士+7小纜車", "name": "來回巴士+7小纜車", "detail": "", "time": "", "price": 11000, "unit": "/日人", "note": ""}, {"section": "滑雪", "date": "裝備", "name": "單板+雪鞋", "detail": "1日", "time": "", "price": 9200, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "2日", "time": "", "price": 17400, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "3日", "time": "", "price": 25600, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "安全帽", "detail": "1日", "time": "", "price": 3300, "unit": "／人", "note": ""}, {"section": "機票", "type": "single", "group": "桃園 → 札幌千歲", "date": "2026-02-16", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "price": 13434, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌千歲 → 函館", "date": "2026-02-20", "name": "札幌千歲→函館", "option": "日本航空 JAL 2745", "time": "10:10 → 10:50", "price": 3686, "unit": "／人", "note": "來源：Trip.com；行李：小型個人行李 ×1、手提行李 ×1、託運行李 2件 × 23kg"}, {"section": "機票", "type": "choice", "group": "札幌千歲 → 函館", "date": "2026-02-20", "name": "札幌千歲→函館", "option": "日本航空 JAL 2749", "time": "14:10 → 14:50", "price": 2609, "unit": "／人", "note": ""}, {"section": "機票", "type": "single", "group": "函館 → 桃園", "date": "2026-02-21", "name": "函館→桃園", "detail": "星宇航空 JX861", "time": "18:00 HKD → 21:40 TPE", "price": 11866, "unit": "／人", "note": ""}], "days": 6, "people": 3, "route": "札幌＋函館", "roomDesc": "札幌王子飯店 1間×4晚；函館JR旅館 1間×1晚"}, {"title": "② 2/17～2/21｜3人", "items": [{"section": "住宿", "date": "札幌", "name": "札幌王子飯店", "detail": "", "time": "", "price": 4388, "unit": "/間晚", "note": "*1間*4晚 (無早餐，早餐每人額外+722)"}, {"section": "滑雪", "date": "來回巴士+7小纜車", "name": "來回巴士+7小纜車", "detail": "", "time": "", "price": 11000, "unit": "/日人", "note": ""}, {"section": "滑雪", "date": "裝備", "name": "單板+雪鞋", "detail": "1日", "time": "", "price": 9200, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "2日", "time": "", "price": 17400, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "3日", "time": "", "price": 25600, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "安全帽", "detail": "1日", "time": "", "price": 3300, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌來回機票", "option": "方案 1", "date": "2026-02-17／2月21日", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "return_detail": "中華航空 CI2131", "return_time": "10:40 CTS → 14:15 TPE", "price": 24124, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌來回機票", "option": "方案 2", "date": "2026-02-17／2月21日", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "return_detail": "中華航空 CI131", "return_time": "14:40 CTS → 18:15 TPE", "price": 24181, "unit": "／人", "note": ""}], "days": 5, "people": 3, "route": "札幌", "roomDesc": "札幌王子飯店 1間×4晚"}, {"title": "③ 3/09～3/14 6天｜4人(會去函館，有日本國內線)", "items": [{"section": "住宿", "date": "札幌", "name": "札幌王子飯店", "detail": "", "time": "", "price": 2611, "unit": "/間晚", "note": "*2間*4晚 (無早餐，早餐每人額外+722)"}, {"section": "住宿", "date": "函館", "name": "函館JR旅館", "detail": "", "time": "", "price": 3132, "unit": "/間晚", "note": "*2間*1晚 (無早餐，早餐每人額外+722)"}, {"section": "滑雪", "date": "來回巴士+7小纜車", "name": "來回巴士+7小纜車", "detail": "", "time": "", "price": 11000, "unit": "/日人", "note": ""}, {"section": "滑雪", "date": "裝備", "name": "單板+雪鞋", "detail": "1日", "time": "", "price": 9200, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "2日", "time": "", "price": 17400, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "3日", "time": "", "price": 25600, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "安全帽", "detail": "1日", "time": "", "price": 3300, "unit": "／人", "note": ""}, {"section": "機票", "type": "single", "group": "桃園 → 札幌千歲", "date": "2026-03-09", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "price": 13434, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌千歲 → 函館", "date": "2026-03-13", "name": "札幌千歲→函館", "option": "日本航空 JAL 2749", "time": "12:45 → 13:25", "price": 1728, "unit": "／人", "note": ""}, {"section": "機票", "type": "single", "group": "函館 → 桃園", "date": "2026-03-14", "name": "函館→桃園", "detail": "星宇航空 JX861", "time": "18:00 HKD → 21:40 TPE", "price": 11866, "unit": "／人", "note": ""}], "days": 6, "people": 4, "route": "札幌＋函館", "roomDesc": "札幌王子飯店 2間×4晚；函館JR旅館 2間×1晚"}, {"title": "④ 3/10～3/14｜4人", "items": [{"section": "住宿", "date": "札幌", "name": "札幌王子飯店", "detail": "", "time": "", "price": 2947, "unit": "/間晚", "note": "*2間*4晚"}, {"section": "滑雪", "date": "來回巴士+7小纜車", "name": "來回巴士+7小纜車", "detail": "", "time": "", "price": 11000, "unit": "/日人", "note": ""}, {"section": "滑雪", "date": "裝備", "name": "單板+雪鞋", "detail": "1日", "time": "", "price": 9200, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "2日", "time": "", "price": 17400, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "單板+雪鞋", "detail": "3日", "time": "", "price": 25600, "unit": "／人", "note": ""}, {"section": "滑雪", "date": "", "name": "安全帽", "detail": "1日", "time": "", "price": 3300, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌來回機票", "option": "方案 1", "date": "2026-03-10／3月14日", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "return_detail": "中華航空 CI2131", "return_time": "10:40 CTS → 14:15 TPE", "price": 24124, "unit": "／人", "note": ""}, {"section": "機票", "type": "choice", "group": "札幌來回機票", "option": "方案 2", "date": "2026-03-10／3月14日", "name": "桃園→札幌千歲", "detail": "中華航空 CI130", "time": "08:35 TPE → 13:20 CTS", "return_detail": "中華航空 CI131", "return_time": "14:40 CTS → 18:15 TPE", "price": 24181, "unit": "／人", "note": ""}], "days": 5, "people": 4, "route": "札幌", "roomDesc": "札幌王子飯店 2間×4晚"}];
const JPY_RATE=0.20;
let active=0;

const state=packages.map(p=>({
  flights:{}, hotels:{},
  ski:{busTrips:1,gearDays:1,helmetPeople:1}
}));

function nt(n){return "NT$ "+Math.round(n).toLocaleString("zh-TW")}
function jp(n){return "¥ "+Math.round(n).toLocaleString("ja-JP")}

function initFlights(){
 packages.forEach((p,pi)=>{
   const seen={};
   p.items.forEach((it,idx)=>{
     if(it.section!=="機票"||it.price==null)return;
     const g=it.group||"航班方案";
     if(seen[g]===undefined){state[pi].flights[g]=idx;seen[g]=idx}
   });
   p.items.forEach((it,idx)=>{
     if(it.section==="住宿"&&it.price!=null)state[pi].hotels[idx]=true;
   });
 });
}
initFlights();

function renderTabs(){
 document.getElementById("tabs").innerHTML=packages.map((p,i)=>`
 <button class="tab ${i===active?'active':''}" onclick="selectPackage(${i})">
 <div class="date">${p.title.split('｜')[0]}</div><div class="sub">${p.days}天｜${p.people}人｜${p.route}</div></button>`).join("");
}

function renderFlights(p){
 const flights=p.items.map((it,idx)=>({it,idx})).filter(x=>x.it.section==="機票"&&x.it.price!=null);
 if(!flights.length)return "";
 let h=`<div class="section"><div class="section-title">機票</div>`;

 [...new Set(flights.map(x=>x.it.group))].forEach(g=>{
   const arr=flights.filter(x=>x.it.group===g);
   h+=`<div class="sub-title">${g}</div>`;

   arr.forEach(({it,idx},n)=>{
     const checked=state[active].flights[g]===idx;

     if(it.type==="choice" && it.return_detail){
       h+=`<div class="row"><div class="left">
       <input type="checkbox" ${checked?"checked":""} onchange="flightToggle('${encodeURIComponent(g)}',${idx},this.checked)">
       <div>
         <div class="name">${it.option||`方案 ${n+1}`}</div>
         <div class="detail">${it.date||""}</div>
         <div class="detail"><b>${it.detail}</b>　${it.time}</div>
         <div class="detail"><b>${it.return_detail}</b>　${it.return_time}</div>
         ${it.note?`<div class="detail">${it.note}</div>`:""}
         <span class="tag">來回／人</span>
       </div></div>
       <div class="price">${nt(it.price)}<div class="currency">NT$／人</div></div></div>`;
     } else {
       const title=it.type==="choice" ? (it.option||`方案 ${n+1}`) : (it.detail||it.name);
       h+=`<div class="row"><div class="left">
       <input type="checkbox" ${checked?"checked":""} onchange="flightToggle('${encodeURIComponent(g)}',${idx},this.checked)">
       <div>
         ${it.type==="choice" ? `<div class="name">${title}</div>` : `<div class="name">${it.name}</div>`}
         ${it.date?`<div class="detail">${it.date}</div>`:""}
         ${it.type==="choice" ? `<div class="detail"><b>${it.detail||""}</b>　${it.time||""}</div>` : `<div class="detail">${it.detail||""}</div><div class="detail">${it.time||""}</div>`}
         ${it.note?`<div class="detail">${it.note}</div>`:""}
         <span class="tag">${it.unit||"／人"}</span>
       </div></div>
       <div class="price">${nt(it.price)}<div class="currency">NT$／人</div></div></div>`;
     }
   });

   if(arr.length>1)h+=`<div class="detail" style="margin-left:28px;color:#b45309">同一航段請擇一。</div>`;
 });
 return h+"</div>";
}
function renderHotels(p){
 const hs=p.items.map((it,idx)=>({it,idx})).filter(x=>x.it.section==="住宿"&&x.it.price!=null);
 if(!hs.length)return "";
 let h=`<div class="section"><div class="section-title">住宿</div>`;
 hs.forEach(({it,idx})=>{
  h+=`<div class="row"><div class="left"><input type="checkbox" checked disabled>
  <div><div class="name">${it.name}</div><div class="detail">${it.note||""}</div></div></div>
  <div class="price">${nt(it.price)}<div class="currency">NT$／間／晚</div></div></div>`;
 });
 return h+"</div>";
}

function renderSki(p){
 const ski=p.items.filter(it=>it.section==="滑雪"&&it.price!=null);
 const bus=ski.find(it=>it.name==="來回巴士+7小纜車");
 const gear=ski.filter(it=>it.name==="單板+雪鞋" && ["1日","2日","3日"].includes(it.detail));
 const helmet=ski.find(it=>it.name==="安全帽");
 const people = state[active].people || p.people;
 let h=`<div class="section"><div class="section-title">滑雪</div>`;

 // 來回巴士＋7小纜車：不綁定每日人數，直接填「趟數」
 if(bus){
  const trips=Math.max(0,state[active].ski.busTrips||0), per=bus.price;
  h+=`<div class="ski-block">
    <div class="ski-head">來回巴士＋7小纜車 <span class="jpy">${jp(per)}／人／日</span></div>
    <div class="detail">1人1日為1趟</div>
    <div class="day-control">
      <label>趟</label>
      <input class="day-input" type="number" min="0" max="100" value="${trips}" onchange="setSki('busTrips',this.value)">
      <span class="day-unit">趟</span>
    </div>
    <div class="calc-line">¥${per.toLocaleString()} × ${trips}趟 = <b>${jp(per*trips)}</b> <span class="ntd">（${nt(per*trips*JPY_RATE)}）</span></div>
  </div>`;
 }

 // 單板＋雪鞋：3擇一；人數由上方「滑雪人數」輸入欄控制
 h+=`<div class="ski-block">
   <div class="ski-head">單板＋雪鞋</div>
   <div class="detail">3擇一</div>
   <div class="day-control" style="margin:8px 0 10px">
     <label>滑雪人數</label>
     <input class="day-input" type="number" min="0" max="50" value="${people}" onchange="setPeople(this.value)">
     <span class="day-unit">人</span>
   </div>`;

 gear.sort((a,b)=>parseInt(a.detail)-parseInt(b.detail)).forEach(it=>{
   const days=parseInt(it.detail,10);
   const checked=state[active].ski.gearDays===days;
   const totalJPY=it.price*people;
   h+=`<label class="gear-option">
     <input type="radio" name="gear-${active}" ${checked?"checked":""} onchange="setSki('gearDays',${days})">
     <span class="gear-days">${it.detail} × ${people}人</span>
     <span class="gear-price">${jp(it.price)}／人
       <div class="currency">合計 ${jp(totalJPY)} ≈ ${nt(totalJPY*JPY_RATE)}</div>
     </span>
   </label>`;
 });
 const selectedGear=gear.find(it=>parseInt(it.detail,10)===state[active].ski.gearDays);
 if(selectedGear){
   const totalJPY=selectedGear.price*people;
   h+=`<div class="calc-line">目前選擇：${selectedGear.detail} × ${people}人 = <b>${jp(totalJPY)}</b> <span class="ntd">（${nt(totalJPY*JPY_RATE)}）</span></div>`;
 }
 h+=`</div>`;

 // 安全帽：不綁定每日人數，直接填「人數」
 if(helmet){
  const n=Math.max(0,state[active].ski.helmetPeople||0), per=helmet.price;
  h+=`<div class="ski-block">
    <div class="ski-head">安全帽 <span class="jpy">${jp(per)}／人／日</span></div>
    <div class="detail">1人1日為1人</div>
    <div class="day-control">
      <label>人</label>
      <input class="day-input" type="number" min="0" max="100" value="${n}" onchange="setSki('helmetPeople',this.value)">
      <span class="day-unit">人</span>
    </div>
    <div class="calc-line">¥${per.toLocaleString()} × ${n}人 = <b>${jp(per*n)}</b> <span class="ntd">（${nt(per*n*JPY_RATE)}）</span></div>
  </div>`;
 }

 h+=`<div class="notice">來回巴士＋7小纜車與安全帽可分開填寫實際使用人次／趟數，不會強制套用同一個人數。</div></div>`;
 return h;
}
function renderDetails(){
 const p=packages[active];
 document.getElementById("details").innerHTML=`<h2>${p.title}</h2><div class="meta">${p.roomDesc}</div>`+
 renderFlights(p)+renderHotels(p)+renderSki(p)+
 `<button class="reset" onclick="resetPackage()">恢復此方案預設選項</button>`;
}

function calc(){
 const p=packages[active]; let flight=0,hotel=0,skiJPY=0;
 p.items.forEach((it,idx)=>{
   if(it.section==="機票"&&it.price!=null){
     if(state[active].flights[it.group]===idx) flight+=it.price*p.people;
   }
   if(it.section==="住宿"&&it.price!=null){
     const hk=it.name.includes("函館"),rooms=active>=2?2:1,nights=hk?1:4;
     hotel+=it.price*rooms*nights;
   }
 });
 const people=state[active].people||p.people;
 const ski=p.items.filter(it=>it.section==="滑雪"&&it.price!=null);
 const bus=ski.find(it=>it.name==="來回巴士+7小纜車");
 const gear=ski.filter(it=>it.name==="單板+雪鞋");
 const helmet=ski.find(it=>it.name==="安全帽");
 const busJPY=bus?bus.price*(state[active].ski.busTrips||0):0;
 const g=gear.find(it=>parseInt(it.detail,10)===state[active].ski.gearDays)||gear[0];
 const gearJPY=g?g.price*people:0;
 const helmetJPY=helmet?helmet.price*(state[active].ski.helmetPeople||0):0;
 skiJPY=busJPY+gearJPY+helmetJPY;
 const skiNT=skiJPY*JPY_RATE;
 const total=flight+hotel+skiNT;
 return {flight,hotel,skiJPY,skiNT,total,per:total/p.people,busJPY,gearJPY,helmetJPY};
}
function renderSummary(){
 const p=packages[active],c=calc();
 document.getElementById("summary").innerHTML=`<h2>總金額</h2>
 <div class="rate">匯率<br><b>1 JPY = NT$0.20</b></div>
 <div class="big">${nt(c.total)}</div><div class="per">每人 ${nt(c.per)}</div><div class="small">行程人數 ${p.people} 人｜滑雪裝備人數 ${state[active].people} 人</div>
 <div class="breakdown">
 <div><span>機票</span><b>${nt(c.flight)}</b></div>
 <div><span>住宿</span><b>${nt(c.hotel)}</b></div>
 <div><span>滑雪原價</span><b>${jp(c.skiJPY)}</b></div>
 <div><span>滑雪換算</span><b>${nt(c.skiNT)}</b></div>
 </div>
 <div class="small" style="margin-top:10px">滑雪：巴士／纜車 ${jp(c.busJPY)}＋裝備 ${jp(c.gearJPY)}＋安全帽 ${jp(c.helmetJPY)}</div>`;
}

function selectPackage(i){active=i;renderTabs();renderDetails();renderSummary()}
function flightToggle(gEnc,idx,checked){
 const g=decodeURIComponent(gEnc);
 if(checked)state[active].flights[g]=idx;
 else if(state[active].flights[g]===idx)delete state[active].flights[g];
 renderDetails();renderSummary();
}
function setSki(key,val){
 let n=parseInt(val,10);if(!Number.isFinite(n)||n<0)n=0;
 state[active].ski[key]=n;renderDetails();renderSummary();
}
function setPeople(val){
 let n=parseInt(val,10);if(!Number.isFinite(n)||n<0)n=0;
 state[active].people=n;renderDetails();renderSummary();
}
function resetPackage(){
 state[active].ski={busTrips:1,gearDays:1,helmetPeople:1};
 state[active].people=packages[active].people;
 state[active].flights={};
 const p=packages[active],seen={};
 p.items.forEach((it,idx)=>{
  if(it.section==="機票"&&it.price!=null&&!seen[it.group]){state[active].flights[it.group]=idx;seen[it.group]=true}
 });
 renderDetails();renderSummary();
}
selectPackage(0);
</script>
</body>
</html>
