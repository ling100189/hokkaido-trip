function flightNo(s){
  if(!s)return "";
  const m=s.match(/([A-Z]{2,4})\s*(\d{3,4})/);
  return m ? `${m[1]}${m[2]}` : s;
}

function airlineName(s){
  if(!s)return "";
  if(s.includes("中華航空")) return "中華航空";
  if(s.includes("日本航空")) return "日本航空";
  if(s.includes("星宇航空")) return "星宇航空";
  return "";
}

function normalizeGearDays(){
  state.forEach(s=>s.members.forEach(m=>{
    if(m.gearDays===undefined) m.gearDays=m.gear?1:0;
  }));
}
normalizeGearDays();
function normalizeHelmetDays(){
  state.forEach(s=>s.members.forEach(m=>{

  }));
}
normalizeHelmetDays();
function normalizeCoach(){
  state.forEach(s=>{
    const old=s.ski.coach;
    if(old && Array.isArray(old.days)){
      while(old.days.length<3) old.days.push({type:"none",duration:"full",members:[]});
      old.days=old.days.slice(0,3); return;
    }
    s.ski.coach={days:[
      old?{type:old.type||"none",duration:old.duration||"full",members:Array.isArray(old.members)?old.members:[]}:{type:"none",duration:"full",members:[]},
      {type:"none",duration:"full",members:[]},{type:"none",duration:"full",members:[]}
    ]};
  });
}

function coachDayData(day){
  const c=state[active].ski.coach;
  if(!c.days)c.days=[{type:"none",duration:"full",members:[]},{type:"none",duration:"full",members:[]},{type:"none",duration:"full",members:[]}];
  while(c.days.length<3)c.days.push({type:"none",duration:"full",members:[]});
  return c.days[day];
}
function coachPrice(d){
  const season=(active===0||active===1)?"旺季":"淡季";
  if(d.type==="premium")return season==="旺季"?123000:113000;
  return d.duration==="half"?(season==="旺季"?65000:55000):(season==="旺季"?88000:78000);
}
function coachTotal(d){
  if(d.type==="none"||!d.members.length)return 0;
  const n=d.members.length,base=coachPrice(d);
  return base+(n>2?(n-2)*(d.duration==="half"?3000:5000):0);
}
function renderFlights(p){
  const flights=p.items.map((it,idx)=>({it,idx})).filter(x=>x.it.section==="機票"&&x.it.price!=null);
  if(!flights.length)return "";
  let h=`<div class="section"><div class="section-title">機票</div>`;

  [...new Set(flights.map(x=>x.it.group))].forEach(g=>{
    const arr=flights.filter(x=>x.it.group===g);
    h+=`<div class="sub-title">${g}</div>`;
    if((active===0||active===2) && g==="札幌 丘珠(OKD) → 函館(HKD)"){
      h+=`<div class="detail flight-group-note">來源：Trip.com；行李：小型個人行李 ×1、手提行李 ×1、託運行李 2件 × 23kg</div>`;
    }

    arr.forEach(({it,idx},n)=>{
      const checked=state[active].flights[g]===idx;

      if(it.type==="choice" && it.return_detail){
        const outboundNo=flightNo(it.detail);
        const returnNo=flightNo(it.return_detail);
        const outboundAir=airlineName(it.detail);
        const returnAir=airlineName(it.return_detail);
        const combinedTitle = outboundAir && outboundAir===returnAir
          ? `${outboundAir} ${outboundNo} ＋ ${returnNo}`
          : `${outboundAir ? outboundAir+" " : ""}${outboundNo} ＋ ${returnAir ? returnAir+" " : ""}${returnNo}`;
        h+=`<div class="row"><div class="left">
        <input type="checkbox" ${checked?"checked":""} onchange="flightToggle('${encodeURIComponent(g)}',${idx},this.checked)">
        <div>
          <div class="name">${combinedTitle}</div>
          <div class="detail">${it.date ? it.date.split("／")[0] : ""}</div>
          <div class="detail">${it.time||""}</div>
          <div class="detail">${it.date ? (it.date.split("／")[1] ? it.date.split("／")[1] : "") : ""}</div>
          <div class="detail">${it.return_time||""}</div>
          ${it.note?`<div class="detail">${it.note}</div>`:""}
          <span class="tag">來回／人</span>
        </div></div>
        <div class="price">${nt(it.price)}<div class="currency">NT$／人</div></div></div>`;
      } else {
        const rawFlight = it.type==="choice" ? (it.option||it.detail||`方案 ${n+1}`) : (it.detail||it.name);
        const title = `${airlineName(rawFlight) ? airlineName(rawFlight)+" " : ""}${flightNo(rawFlight)}`;
        h+=`<div class="row"><div class="left">
        <input type="checkbox" ${checked?"checked":""} onchange="flightToggle('${encodeURIComponent(g)}',${idx},this.checked)">
        <div>
          <div class="name">${title}</div>
          ${it.date?`<div class="detail">${it.date}</div>`:""}
          ${it.time?`<div class="detail">${it.time}</div>`:""}
          ${it.note?`<div class="detail">${it.note}</div>`:""}
          <span class="tag">${it.unit||"／人"}</span>
        </div></div>
        <div class="price">${nt(it.price)}<div class="currency">NT$／人</div></div></div>`;
      }
    });

    if(arr.length>1)h+=`<div class="detail" style="margin-left:28px;color:#e87525">同一航段請擇一。</div>`;
  });
  return h+"</div>";
}

    state[active].members.map((m,i)=>`
      <label class="person-name-field">
        <span>人員 ${i+1}</span>
        <input type="text" value="${String(m.name).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}"
          placeholder="請輸入姓名"
          onchange="setMemberName(${i},this.value)">
      </label>
    `).join("")+
    `</div>`;
}

function memberChecks(kind){
 return `<div class="members">`+state[active].members.map((m,i)=>`
   <label class="member-chip"><input type="checkbox" ${m[kind]?'checked':''} onchange="setMember('${kind}',${i},this.checked)"><span>${m.name}</span></label>
 `).join('')+`</div>`;
}
function memberDays(){return `<div class="member-days">`+state[active].members.map((m,i)=>{
  const days=m.busDays||0;
  return `<div class="member-day-row"><span>${m.name}</span><div class="member-day-options">
    
    <button type="button" class="${days===0?'selected':''}" onclick="setMemberBusDays(${i},0)">不用</button>
    <button type="button" class="${days===1?'selected':''}" onclick="setMemberBusDays(${i},1)">1日</button>
    <button type="button" class="${days===2?'selected':''}" onclick="setMemberBusDays(${i},2)">2日</button>
    <button type="button" class="${days===3?'selected':''}" onclick="setMemberBusDays(${i},3)">3日</button>
  </div></div>`;
}).join('')+`</div>`;}
function renderSki(p){
 const ski=p.items.filter(it=>it.section==="滑雪"&&it.price!=null);
 const bus=ski.find(it=>it.name==="來回巴士+7小纜車");
 const gear=ski.filter(it=>it.name==="單板+雪鞋" && ["1日","2日","3日"].includes(it.detail));
 const helmet=ski.find(it=>it.name==="安全帽");
 let h=`<div class="section"><div class="section-title">滑雪</div>`;
 if(bus){
  const totalDays=state[active].members.reduce((sum,m)=>sum+(m.busDays||0),0), per=bus.price;
  h+=`<div class="ski-block"><div class="ski-head">來回巴士＋7小纜車<span class="ski-price-line"><span class="jpy">${jp(per)}／人／日</span></span></div><div class="detail">每個人可以設定不同滑雪天數</div>${memberDays()}<div class="calc-line">${jp(per)} × ${totalDays}人日 = <b>${jp(per*totalDays)}</b> <span class="ntd">（${nt(per*totalDays*JPY_RATE)}）</span></div></div>`;
 }
 gear.sort((a,b)=>parseInt(a.detail)-parseInt(b.detail));
 const gearPrices={};
 gear.forEach(it=>gearPrices[parseInt(it.detail,10)]=it.price);
 h+=`<div class="ski-block"><div class="ski-head">單板＋雪鞋<span class="ski-price-line"><span class="jpy">${jp(gearPrices[1])}／1日 ｜ ${jp(gearPrices[2])}／2日 ｜ ${jp(gearPrices[3])}／3日</span></span></div><div class="detail">每個人可以設定不同租借天數</div>`;
 h+=`<div class="gear-person-list">`;
 state[active].members.forEach((m,i)=>{
   const days=m.gearDays||0;
   h+=`<div class="gear-person-row">
     <div class="gear-person-name">${memberName(i)}</div>
     <div class="gear-day-options">
       <button type="button" class="${days===0?'selected':''}" onclick="setMemberGearDays(${i},0)">不用</button>
       <button type="button" class="${days===1?'selected':''}" onclick="setMemberGearDays(${i},1)">1日</button>
       <button type="button" class="${days===2?'selected':''}" onclick="setMemberGearDays(${i},2)">2日</button>
       <button type="button" class="${days===3?'selected':''}" onclick="setMemberGearDays(${i},3)">3日</button>
     </div>
   </div>`;
 });
 h+=`</div>`;
 let gearJPY=0;
 state[active].members.forEach(m=>{
   const d=m.gearDays||0;
   if(d&&gearPrices[d]) gearJPY+=gearPrices[d];
 });
 h+=`<div class="calc-line">單板＋雪鞋合計 = <b>${jp(gearJPY)}</b> <span class="ntd">（${nt(gearJPY*JPY_RATE)}）</span></div></div>`;
 if(helmet){
  const per=helmet.price;
  h+=`<div class="ski-block">
    <div class="ski-head">安全帽<span class="ski-price-line"><span class="jpy">${jp(per)}／人／日</span></span></div>
    <div class="detail">每個人可以設定不同租借天數</div>
    <div class="helmet-person-list">`;
  state[active].members.forEach((m,i)=>{
    const days=m.helmetDays||0;
    h+=`<div class="helmet-person-row">
      <div class="helmet-person-name">${memberName(i)}</div>
      <div class="helmet-day-options">
        <button type="button" class="${days===0?'selected':''}" onclick="setMemberHelmetDays(${i},0)">不用</button>
        <button type="button" class="${days===1?'selected':''}" onclick="setMemberHelmetDays(${i},1)">1日</button>
        <button type="button" class="${days===2?'selected':''}" onclick="setMemberHelmetDays(${i},2)">2日</button>
        <button type="button" class="${days===3?'selected':''}" onclick="setMemberHelmetDays(${i},3)">3日</button>
      </div>
    </div>`;
  });
  h+=`</div>`;
  const helmetJPY=state[active].members.reduce((sum,m)=>sum+per*(m.helmetDays||0),0);
  const helmetPeople=state[active].members.filter(m=>(m.helmetDays||0)>0).length;
  h+=`<div class="calc-line">安全帽合計 = <b>${jp(helmetJPY)}</b> <span class="ntd">（${nt(helmetJPY*JPY_RATE)}）</span></div></div>`;
}
 h+=`<div class="notice">滑雪相關費用可以逐人設定，不需要滑雪或不需要租裝備的人不會被計入。</div></div>`;
  const coach=state[active].ski.coach;
  const coachSeason=(active===0||active===1)?"旺季":"淡季";
  h+=`<div class="ski-block coach-block"><div class="ski-head">滑雪教練<span class="ski-price-line"><span class="jpy">${coachSeason}</span></span></div><div class="small" style="margin-top:4px">最多可設定 3 天，每天可分別選擇課程與上課人員。</div>`;
  for(let day=0;day<3;day++){
    const d=coachDayData(day),count=d.members.length,total=coachTotal(d);
    const label=d.type==="none"?"不需要":(d.type==="premium"?"Premium 全天":(d.duration==="half"?"一般半天":"一般全天"));
    h+=`<div class="coach-day ${coachOpen[day]?'is-open':''}"><button type="button" class="coach-day-toggle" onclick="toggleCoachDay(${day})"><span>第 ${day+1} 天</span><b>${label}${count?`｜${count}人｜${jp(total)}`:""}</b><i>${coachOpen[day]?'－':'＋'}</i></button><div class="coach-day-body" ${coachOpen[day]?'':'hidden'}><div class="coach-section-title">課程</div><div class="coach-choice-list"><button type="button" class="${d.type==='none'?'selected':''}" onclick="setCoachDayType(${day},'none')">不需要</button><button type="button" class="${d.type==='normal'?'selected':''}" onclick="setCoachDayType(${day},'normal')">一般私人課程</button><button type="button" class="${d.type==='premium'?'selected':''}" onclick="setCoachDayType(${day},'premium')">Premium 私人課程</button></div>`;
    if(d.type!=="none"){
      h+=`<div class="coach-section-title">課程時間</div><div class="coach-choice-list"><button type="button" class="${d.duration==='full'?'selected':''}" onclick="setCoachDayDuration(${day},'full')">全天 6 小時</button>`;
      if(d.type==='normal')h+=`<button type="button" class="${d.duration==='half'?'selected':''}" onclick="setCoachDayDuration(${day},'half')">半天 3 小時</button>`;
      h+=`</div><div class="coach-price-line">課程費用 <b>${jp(coachPrice(d))}</b> <span class="ntd">（${nt(coachPrice(d)*JPY_RATE)}）</span></div><div class="coach-section-title">上課人員</div><div class="coach-member-list">`;
      state[active].members.forEach((m,i)=>{const checked=d.members.includes(i);h+=`<button type="button" class="coach-member ${checked?'selected':''}" onclick="toggleCoachDayMember(${day},${i})">${checked?'✓ ':''}${memberName(i)}</button>`;});
      h+=`</div>`;
      if(count){const share=total/count;h+=`<div class="coach-price-line">第 ${day+1} 天教練總費用 <b>${jp(total)}</b> <span class="ntd">（${nt(total*JPY_RATE)}）</span></div><div class="detail">上課 ${count} 人，每人分攤約 ${jp(share)}（${nt(share*JPY_RATE)}）</div>`;}else h+=`<div class="detail">請選擇上課人員</div>`;
    }
    h+=`</div></div>`;
  }
  h+=`</div>`;
 return h;
}
function renderDetails(){
 const p=packages[active];
 document.getElementById("details").innerHTML=`<h2>${p.title}</h2><div class="meta">${p.roomDesc}</div>`+
 renderFlights(p)+
 `<div id="airportTransportPanel"></div>`+
 renderHotels(p)+
 `<div id="transportPanel"></div>`+
 renderSki(p)+
 `<button class="reset" onclick="resetPackage()">恢復此方案預設選項</button>`;
 renderTransport();
}

function calc(){
 const p=packages[active],people=p.people;
 const perPerson=Array.from({length:people},()=>({flight:0,hotel:0,bus:0,gear:0,helmet:0,coach:0,total:0}));
 p.items.forEach((it,idx)=>{
   if(it.section==="機票"&&it.price!=null&&state[active].flights[it.group]===idx) state[active].members.forEach((m,i)=>{if(m.flight)perPerson[i].flight+=it.price;});
   if(it.section==="住宿"&&it.price!=null){const hk=it.name.includes("函館"),rooms=active>=2?2:1,nights=hk?1:4,share=it.price*rooms*nights/people;perPerson.forEach(x=>x.hotel+=share);}
 });
 const ski=p.items.filter(it=>it.section==="滑雪"&&it.price!=null),bus=ski.find(it=>it.name==="來回巴士+7小纜車"),gear=ski.filter(it=>it.name==="單板+雪鞋"),helmet=ski.find(it=>it.name==="安全帽"),selectedGear=gear.find(it=>parseInt(it.detail,10)===state[active].ski.gearDays)||gear[0];
 state[active].members.forEach((m,i)=>{if(bus)perPerson[i].bus=bus.price*(m.busDays||0)*JPY_RATE;const personalGear=gear.find(it=>parseInt(it.detail,10)===(m.gearDays||0));if(personalGear)perPerson[i].gear=personalGear.price*JPY_RATE;if(helmet&&(m.helmetDays||0)>0)perPerson[i].helmet=helmet.price*(m.helmetDays||0)*JPY_RATE;perPerson[i].total=perPerson[i].flight+perPerson[i].hotel+perPerson[i].bus+perPerson[i].gear+perPerson[i].helmet;});
 const flight=perPerson.reduce((s,x)=>s+x.flight,0),hotel=perPerson.reduce((s,x)=>s+x.hotel,0),busJPY=bus?state[active].members.reduce((s,m)=>s+(m.busDays||0),0)*bus.price:0,gearJPY=state[active].members.reduce((s,m)=>{const g=gear.find(it=>parseInt(it.detail,10)===(m.gearDays||0));return s+(g?g.price:0)},0),helmetJPY=helmet?state[active].members.reduce((s,m)=>s+helmet.price*(m.helmetDays||0),0):0,skiJPY=busJPY+gearJPY+helmetJPY,total=perPerson.reduce((s,x)=>s+x.total,0);
 
  const coach=state[active].ski.coach;
  if(coach && Array.isArray(coach.days))coach.days.forEach(d=>{
    if(d.type!=="none"&&d.members.length){const total=coachTotal(d),share=total/d.members.length*JPY_RATE;d.members.forEach(i=>{if(perPerson[i])perPerson[i].coach+=share;});}
  });

  perPerson.forEach(x=>{x.total=x.flight+x.hotel+x.bus+x.gear+x.helmet+x.coach;});
  const coachNT=perPerson.reduce((s,x)=>s+x.coach,0);
  const transportTotalNT=TRANSPORT_DATA[active].routes.reduce((sum,r,ri)=>{
    const choice=transportChoice[active][ri];
    if(r.roundtrip){
      const out=r.outbound.options[choice?.outbound??0];
      const back=r.inbound.options[choice?.inbound??0];
      return sum
        +(out?(out.currency==="JPY"?out.price*JPY_RATE*people:out.price):0)
        +(back?(back.currency==="JPY"?back.price*JPY_RATE*people:back.price):0);
    }
    const oi=choice??0;
    if(oi<0)return sum;
    const o=r.options[oi];
    if(!o)return sum;
    return sum+(o.currency==="JPY"?o.price*JPY_RATE*people:o.price);
  },0);
  const transportPerPersonNT=transportTotalNT/people;
  perPerson.forEach(x=>{x.transport=transportPerPersonNT;x.total+=transportPerPersonNT;});
  const grandTotal=perPerson.reduce((s,x)=>s+x.total,0);

return {flight,hotel,skiJPY,skiNT:skiJPY*JPY_RATE,coachNT,transportNT:transportTotalNT,total:grandTotal,per:grandTotal/people,perPerson,busJPY,gearJPY,helmetJPY};
}

function renderTransport(){
  const airportPanel=document.getElementById("airportTransportPanel");
  const transportPanel=document.getElementById("transportPanel");
  const pkg=TRANSPORT_DATA[active];
  if(!pkg){
    if(airportPanel)airportPanel.innerHTML="";
    if(transportPanel)transportPanel.innerHTML="";
    return;
  }

  const airportRoutes=pkg.routes.filter(g=>!g.roundtrip);
  const roundtripRoutes=pkg.routes.filter(g=>g.roundtrip);

  if(airportPanel){
    airportPanel.innerHTML=`
      <div class="section">
        <div class="section-title">日本機場⇔飯店交通</div>
        <div class="transport-section">
          ${airportRoutes.map((g,ri)=>{
            const realIndex=pkg.routes.indexOf(g);
            const selected=transportChoice[active][realIndex]??0;
            return `<div class="transport-route">
              <div class="transport-route-title">${g.route}</div>
              <div class="transport-options">
                ${g.options.map((o,oi)=>`<button type="button" class="transport-option ${selected===oi?'selected':''}" onclick="setTransport(${realIndex},${oi})">
                  ${o.type} <b>${o.currency==='JPY'?jp(o.price):nt(o.price)}</b>${o.source?`（${o.source}）`:''}${o.note?`<span class="transport-note">（${o.note}）</span>`:''}
                </button>`).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  if(transportPanel){
    transportPanel.innerHTML=`
      <div class="section">
        <div class="section-title">交通</div>
        <div class="transport-section">
          ${roundtripRoutes.map((g,ri)=>{
            const realIndex=pkg.routes.indexOf(g);
            const selected=transportChoice[active][realIndex]||{outbound:0,inbound:0};
            const renderDir=(dir,key)=>`
              <div class="transport-route" style="border-bottom:0;padding-bottom:4px">
                <div class="transport-route-title">${dir.route}</div>
                <div class="transport-options">
                  ${dir.options.map((o,oi)=>`<button type="button" class="transport-option ${selected[key]===oi?'selected':''}" onclick="setTransportRoundtrip(${realIndex},'${key}',${oi})">
                    ${o.type==='北海道中央巴士'?'巴士':o.type}
                  </button>`).join('')}
                </div>
              </div>`;
            return `<div class="transport-route roundtrip-card">
              <div class="transport-route-title">${g.roundtrip}</div>
              <div class="detail" style="margin-bottom:8px">${g.priceLine}</div>
              ${renderDir(g.outbound,'outbound')}
              ${renderDir(g.inbound,'inbound')}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }
}
function setTransport(routeIndex, optionIndex){
  transportChoice[active][routeIndex]=optionIndex;
  renderDetails();renderSummary();
}
function setTransportRoundtrip(routeIndex,direction,optionIndex){
  const current=transportChoice[active][routeIndex]||{outbound:0,inbound:0};
  current[direction]=optionIndex;
  transportChoice[active][routeIndex]=current;
  renderDetails();renderSummary();
}

function renderSummary(){
  const p=packages[active],c=calc();
  document.getElementById("summary").innerHTML=`<h2>費用總結</h2><div class="rate">匯率<br><b>1 JPY = NT$0.20</b></div><div class="people-summary">${c.perPerson.map((x,i)=>`<div class="person-total"><span>${memberName(i)}</span><b>${nt(x.total)}</b></div><div class="person-detail">機票 ${nt(x.flight)}｜住宿 ${nt(x.hotel)}｜交通 ${nt(x.transport||0)}｜滑雪 ${nt(x.bus+x.gear+x.helmet)}｜教練 ${nt(x.coach)}</div>`).join('')}</div><div class="big">${nt(c.total)}</div><div class="per">全員合計</div><div class="breakdown"><div><span>機票</span><b>${nt(c.flight)}</b></div><div><span>住宿</span><b>${nt(c.hotel)}</b></div><div><span>交通</span><b>${nt(c.transportNT)}</b></div><div><span>滑雪換算</span><b>${nt(c.skiNT)}</b></div><div><span>滑雪教練</span><b>${nt(c.coachNT)}</b></div></div><div class="small" style="margin-top:10px">滑雪：巴士／纜車 ${jp(c.busJPY)}＋裝備 ${jp(c.gearJPY)}＋安全帽 ${jp(c.helmetJPY)}</div>`;
}

function selectPackage(i){active=i;renderTabs();renderPeopleNames();renderDetails();renderSummary()}
function flightToggle(gEnc,idx,checked){
 const g=decodeURIComponent(gEnc);
 if(checked)state[active].flights[g]=idx;
 else if(state[active].flights[g]===idx)delete state[active].flights[g];
 renderDetails();renderSummary();
}
function setSki(key,val){
 let n=parseInt(val,10);if(!Number.isFinite(n)||n<0)n=0;
 state[active].ski[key]=n;renderDetails();renderSummary();
}
function setMember(kind,idx,checked){if(state[active].members[idx])state[active].members[idx][kind]=checked;renderDetails();renderSummary();}
function setMemberName(idx,value){if(state[active].members[idx])state[active].members[idx].name=value.trim()||`人員 ${idx+1}`;renderPeopleNames();renderDetails();renderSummary();}
function setMemberHelmetDays(idx,days){
  if(state[active].members[idx]){
    state[active].members[idx].helmetDays=parseInt(days,10)||0;
    state[active].members[idx].helmet=!!state[active].members[idx].helmetDays;
  }
  renderDetails();renderSummary();
}

function setMemberGearDays(idx,days){
  if(state[active].members[idx]){
    state[active].members[idx].gearDays=parseInt(days,10)||0;
    state[active].members[idx].gear=!!state[active].members[idx].gearDays;
  }
  renderDetails();renderSummary();
}
function toggleCoachDay(day){coachOpen[day]=!coachOpen[day];renderDetails();}
function setCoachDayType(day,type){coachOpen[day]=true;const d=coachDayData(day);d.type=type;if(type==="premium")d.duration="full";if(type==="none")d.members=[];renderDetails();renderSummary();}
function setCoachDayDuration(day,duration){coachOpen[day]=true;coachDayData(day).duration=duration;renderDetails();renderSummary();}
function toggleCoachDayMember(day,idx){coachOpen[day]=true;const d=coachDayData(day),a=d.members,p=a.indexOf(idx);if(p>=0)a.splice(p,1);else a.push(idx);renderDetails();renderSummary();}
function setMemberBusDays(idx,val){let n=parseInt(val,10);if(!Number.isFinite(n)||n<0)n=0;if(state[active].members[idx])state[active].members[idx].busDays=n;renderDetails();renderSummary();}
function resetPackage(){
 state[active].ski={gearDays:1,helmetDays:1,coach:{days:[{type:"none",duration:"full",members:[]},{type:"none",duration:"full",members:[]},{type:"none",duration:"full",members:[]}]}};
 state[active].members=Array.from({length:packages[active].people},(_,i)=>({name:`人員 ${i+1}`,flight:true,busDays:1,gearDays:1,gear:true,helmetDays:1,helmet:true}));
 state[active].flights={};
 const p=packages[active],seen={};
 p.items.forEach((it,idx)=>{
  if(it.section==="機票"&&it.price!=null&&!seen[it.group]){state[active].flights[it.group]=idx;seen[it.group]=true}
 });
 renderDetails();renderSummary();
}
selectPackage(0);
</script>
